name: NEXORA Android CI
on:
  push:
    branches: [ "main", "nexora/android-foundation" ]
  workflow_dispatch:
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply additional native feature updates
        run: python3 scripts/apply_feature_updates.py
      - name: Apply group message pin controls
        run: python3 scripts/apply_message_pins.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35 SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        id: build_apk
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.chatapp.mobile' versionCode='2' versionName='1.1.0'"
      - name: Package complete Android source ZIP
        if: always()
        run: |
          zip -r /tmp/nexora-android-source.zip app .github scripts supabase README.md NEXORA_ANDROID_PLAN_AR.md GOOGLE_LOGIN_SETUP_AR.md build.gradle settings.gradle gradle.properties \
            -x "app/build/*" "*/build/*" "build/*" "*/.gradle/*" ".gradle/*"
      - name: Upload complete Android source ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-source
          path: /tmp/nexora-android-source.zip
          if-no-files-found: error
      - name: Install and launch APK in Android emulator
        timeout-minutes: 5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 180
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.chatapp.mobile/.MainActivity
            sleep 5
            adb shell pidof com.chatapp.mobile
      - name: Upload APK artifact
        if: always() && steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
